# CI: chạy lại đúng các bước kiểm tra trong CLAUDE.md cho mỗi lần đẩy code.
# Máy Windows (CD kiểu "tự kiểm tra định kỳ") CHỈ cập nhật commit mà workflow này báo thành công.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13" # giống backend/Dockerfile
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: OpenAPI không lệch với code
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../contracts/openapi.json

  mt5_gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mt5_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6 # dùng .python-version (3.12)
      - run: uv sync --locked
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # giống frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type TS không lệch với contracts/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run check
      - run: npm run build

  docker:
    # Máy Windows build đúng các Dockerfile này khi deploy: lỗi build phải bị chặn ở đây.
    # Sau đó dựng cả hệ thống và chạy kiểm thử đầu-cuối với Keycloak thật + sao lưu/khôi phục.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Realm JSON hợp lệ và không chứa bí mật
        run: python3 ops/keycloak/check_realm.py ops/keycloak/realm/gold-trading-realm.json
      - name: Theme đăng nhập CutlotDesk khớp màu Dashboard
        run: python3 ops/keycloak/check_theme.py
      - run: docker build -q -t gold_trading/backend:latest backend
      - run: docker build -q -t gold_trading/frontend:latest frontend
      - run: docker build -q -t gold_trading/keycloak:26.8.2 ops/keycloak
      - run: docker build -q -t gold_trading/backup:latest ops/backup
      - name: Kiểm thử cả hệ thống (đăng nhập, phân quyền, break-glass, sao lưu/khôi phục, log)
        run: ops/scripts/ci_stack.sh
