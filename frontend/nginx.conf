# Dashboard, API (/api/) và Keycloak (/auth/) CÙNG MỘT ORIGIN: cookie SameSite=Strict dùng được, không cần CORS.
# Truy cập từ máy khác: Tailscale Serve (HTTPS) -> 127.0.0.1:8080 -> nginx này.

# Không ghi query string (có thể chứa code/state của OIDC) và không ghi header (cookie, token).
log_format gt_safe escape=json
  '{"ts":"$time_iso8601","request_id":"$request_id","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time}';

# Tailscale Serve gửi X-Forwarded-Proto=https; truy cập thẳng localhost thì dùng scheme thật.
map $http_x_forwarded_proto $gt_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $gt_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /dev/stdout gt_safe;
    server_tokens off;

    # DNS nội bộ của Docker; phân giải lúc có request để nginx vẫn chạy khi keycloak/backend chưa lên.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # MT5 Gateway gửi lô tối đa 2.000 nến (~300 KB); mặc định nginx chỉ nhận 1 MB
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        set $gt_backend http://backend:8000;
        proxy_pass $gt_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gt_proto;
        proxy_set_header X-Forwarded-Host $gt_host;
    }

    location /auth/ {
        set $gt_keycloak http://keycloak:8080;
        proxy_pass $gt_keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gt_proto;
        proxy_set_header X-Forwarded-Host $gt_host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location / {
        try_files $uri /index.html;
    }
}
