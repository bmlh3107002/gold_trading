# Dành cho người đã clone repo: build từ code local.
#   docker compose up -d --build
# Không muốn clone code? Dùng deploy/docker-compose.yml.
name: gold_trading

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gold-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-gold_trading}
    ports:
      # Mở ở localhost để dev chạy backend ngoài Docker (uv run ...) vẫn dùng được DB.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: gold_trading/backend:latest
    build: ./backend
    environment:
      GT_MODE: ${GT_MODE:-PAPER}
      # Nguồn nến: SAMPLE (dữ liệu mẫu, mặc định) | CSV | NONE
      GT_DATA_SOURCE: ${GT_DATA_SOURCE:-SAMPLE}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gold}:${POSTGRES_PASSWORD:-gold-local-only}@db:5432/${POSTGRES_DB:-gold_trading}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: gold_trading/frontend:latest
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Chỉ mở ở localhost: API chưa có xác thực.
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  db_data:
