# Dành cho người đã clone repo: build từ code local.
#   docker compose up -d --build
# Không muốn clone code? Dùng deploy/docker-compose.yml.
name: gold-trading

services:
  backend:
    build: ./backend
    environment:
      GT_MODE: ${GT_MODE:-PAPER}
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Chỉ mở ở localhost: API chưa có xác thực.
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:80"
    restart: unless-stopped

  db:
    # Chưa dùng trong khung hiện tại. Bật bằng: docker compose --profile db up -d
    profiles: ["db"]
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-gold_trading}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
