# Theme đăng nhập CutlotDesk: kế thừa keycloak.v2 (PatternFly 5), chỉ đổi màu/chữ cho khớp Dashboard.
# Không sửa template .ftl để nâng cấp Keycloak không bị vỡ.
parent=keycloak.v2
import=common/keycloak

# css/styles.css lấy từ theme cha; cutlotdesk.css đè lên sau.
styles=css/styles.css css/cutlotdesk.css
# Đọc lựa chọn sáng/tối của Dashboard (localStorage "cutlotdesk.theme", cùng origin) trước khi vẽ trang.
scripts=js/cutlotdesk-theme.js

# Tự quản lý sáng/tối bằng data-theme, không dùng chế độ tối theo hệ điều hành của PatternFly.
darkMode=false
