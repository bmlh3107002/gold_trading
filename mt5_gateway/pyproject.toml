[project]
name = "mt5-gateway"
version = "0.8.1"
description = "MT5 Gateway bản CHỈ ĐỌC: đưa nến XAUUSD M15 từ MetaTrader 5 vào backend. Không đặt lệnh."
requires-python = ">=3.11,<3.14"
dependencies = [
  # Thư viện chính thức của MetaQuotes chỉ có trên Windows.
  "MetaTrader5>=5.0.45; sys_platform == 'win32'",
  "tzdata>=2024.2",
]

[project.scripts]
mt5-gateway = "mt5_gateway.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_gateway"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
